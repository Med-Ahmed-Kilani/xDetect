lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  target_modules: ["query", "value"]  # XLM-R attention projections

adapter_training:
  num_epochs: 3
  learning_rate: 3.0e-4   # LoRA adapters use higher LR than full fine-tuning
  batch_size: 16
  warmup_ratio: 0.1
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  seed: 42

scalability:
  target_languages: ["de", "ar"]
  data_sizes: [100, 500, 1000, 2000, "full"]
  backbone_checkpoint: "data/checkpoints/xlmr_base"
  backbone_key: "xlmr_base"
  adapter_checkpoint_template: "data/checkpoints/adapters/{lang}_{n}"
  full_retrain_checkpoint_template: "data/checkpoints/full_retrain/{lang}"
  report_path: "reports/scalability_results.json"

full_retrain:
  num_epochs: 3
  learning_rate: 2.0e-5   # same as backbone training
  batch_size: 16
  warmup_ratio: 0.1
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  seed: 42
